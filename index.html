<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Liens de Versions</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #eaeaea;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 25px;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .link-item {
            background: #3a3a3a;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 6px;
            border-left: 4px solid #58a6ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
            word-break: break-all;
            font-size: 0.95rem;
        }
        a:hover {
            text-decoration: underline;
        }
        .tag-badge {
            background: #238636;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 10px;
            white-space: nowrap;
        }
        .status {
            text-align: center;
            color: #8b949e;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Liens des Releases</h1>
    
    <div class="container" id="links-container">
        <p class="status">Lecture de la page des tags en cours...</p>
    </div>

    <script>
        // 1. Correction de la casse de l'URL cible (gox--->Gox)
        const targetUrl = "https://github.com/goxthegoat-source/my_versions/releases";
        const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);

        fetch(proxyUrl)
            .then(response => {
                if (!response.ok) throw new Error("Erreur de réseau");
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('links-container');
                container.innerHTML = ''; 

                const htmlContent = data.contents;
                
                // 2. Correction de la Regex pour capturer tout le chemin du fichier
                const regex = /href="\/goxthegoat-source\/my_versions\/releases\/download\/([^"]+)"/g;
                let match;
                const uniqueLinks = new Set();

                while ((match = regex.exec(htmlContent)) !== null) {
                    uniqueLinks.add(match[1]);
                }

                if (uniqueLinks.size === 0) {
                    container.innerHTML = '<p class="status">Aucun lien de téléchargement trouvé. Vérifiez que vous avez téléversé des fichiers (assets) dans vos releases !</p>';
                    return;
                }

                uniqueLinks.forEach(filePath => {
                    // filePath contient maintenant "nom_du_tag/nom_du_fichier.extension"
                    const fullUrl = `https://github.com/goxthegoat-source/my_versions/releases/download/${filePath}`;
                    
                    // On extrait juste le nom du fichier pour l'affichage propre dans le badge
                    const fileName = filePath.substring(filePath.lastIndexOf('/') + 1);
                    
                    const div = document.createElement('div');
                    div.className = 'link-item';
                    div.innerHTML = `
                        <a href="${fullUrl}" target="_blank">${fullUrl}</a>
                        <span class="tag-badge">${fileName}</span>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(error => {
                document.getElementById('links-container').innerHTML = `
                    <p class="status" style="color: #f85149;">Erreur lors de la récupération des éléments HTML.</p>
                `;
                console.error(error);
            });
    </script>
</body>
</html>
