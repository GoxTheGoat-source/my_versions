<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Liens de Versions</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #eaeaea;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 25px;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .link-item {
            background: #3a3a3a;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 6px;
            border-left: 4px solid #58a6ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
            word-break: break-all;
            font-size: 0.95rem;
        }
        a:hover {
            text-decoration: underline;
        }
        .tag-badge {
            background: #238636;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 10px;
            white-space: nowrap;
        }
        .status {
            text-align: center;
            color: #8b949e;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Liens de Releases</h1>
    
    <div class="container" id="links-container">
        <p class="status">Lecture de la page des tags en cours...</p>
    </div>

    <script>
        // Utilisation d'un proxy CORS gratuit pour pouvoir lire le HTML de GitHub directement depuis le navigateur
        const targetUrl = "https://github.com/GoxTheGoat-source/my_versions/releases/tag/versions";
        const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);

        fetch(proxyUrl)
            .then(response => {
                if (!response.ok) throw new Error("Erreur de réseau");
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('links-container');
                container.innerHTML = ''; // On vide l'état de chargement

                // Le HTML brut de la page GitHub est stocké dans data.contents
                const htmlContent = data.contents;
                
                // Expression régulière pour attraper tous les href pointant vers /releases/tag/
                const regex = /href="\/GoxTheGoat-source\/my_versions\/releases\/download\/([^"]+)"/g;
                let match;
                const uniqueLinks = new Set();

                // On extrait tous les liens uniques
                while ((match = regex.exec(htmlContent)) !== null) {
                    uniqueLinks.add(match[1]);
                }

                if (uniqueLinks.size === 0) {
                    container.innerHTML = '<p class="status">Aucun lien de tag trouvé. Créez une release sur GitHub !</p>';
                    return;
                }

                // Génération de l'interface pour chaque lien trouvé
                uniqueLinks.forEach(tag => {
                    const fullUrl = `https://github.com/GoxTheGoat-source/my_versions/releases/download/${tag}`;
                    
                    const div = document.createElement('div');
                    div.className = 'link-item';
                    div.innerHTML = `
                        <a href="${fullUrl}" target="_blank">${fullUrl}</a>
                        <span class="tag-badge">${tag}</span>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(error => {
                document.getElementById('links-container').innerHTML = `
                    <p class="status" style="color: #f85149;">Erreur lors de la récupération des éléments HTML.</p>
                `;
                console.error(error);
            });
    </script>
</body>
</html>
